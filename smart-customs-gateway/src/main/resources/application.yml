# ============================================================
# Gateway 服务个性化配置
# 共享配置(Redis/Sa-Token等)来自 Nacos: application-common.yml
# ============================================================

server:
  port: 9999

spring:
  cloud:
    gateway:
      # 服务发现路由
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      # 路由配置
      routes:
        # 系统服务 - 认证相关
        - id: smart-customs-system-auth
          uri: lb://smart-customs-system
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0
        
        # 系统服务
        - id: smart-customs-system
          uri: lb://smart-customs-system
          predicates:
            - Path=/system/**,/resource/**,/tool/**,/monitor/**
          filters:
            - StripPrefix=0
        
        # 代码生成服务
        - id: smart-customs-generator
          uri: lb://smart-customs-system
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=0
        
        # 业务服务
        - id: smart-customs-business
          uri: lb://smart-customs-business
          predicates:
            - Path=/business/**,/customer/**,/erp/**
          filters:
            - StripPrefix=0

# Gateway 日志级别
logging:
  level:
    io.github.yak33.gateway: debug
    org.springframework.cloud.gateway: info
